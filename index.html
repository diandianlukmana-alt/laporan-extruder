<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Problem Produksi Extruder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .navbar { border-bottom: 3px solid #6366f1 !important; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-dark" href="#"><i class="fa-solid fa-industry text-primary me-2"></i>LAPORAN PROBLEM EXTRUDER</a>
            <div class="d-flex align-items-center gap-3">
                <span id="navSessionBadge" class="badge bg-danger px-3 py-2 fw-bold">🔴 BELUM LOGIN</span>
                <button class="btn btn-danger btn-sm fw-bold" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</button>
            </div>
        </div>
    </nav>

    <!-- MODAL LOGIN UTAMA -->
    <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white py-3">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-lock me-2"></i>Login Sistem Produksi Extruder</h5>
                </div>
                <div class="modal-body p-4">
                    <div id="loginAlertBox" class="alert alert-danger d-none py-2 small fw-bold"></div>
                    <form id="loginForm" onsubmit="executeLogin(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Username</label>
                            <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan username..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Password</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan password...">
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-bold">Masuk ke Sistem</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container py-5">
        <h3 class="fw-bold text-dark">Sistem Utama Berhasil Dimuat</h3>
        <p class="text-muted">Silakan lakukan login untuk mengakses form dan dashboard.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const USER_ACCOUNTS = [
            { username: "Amir", pass: "amir123", role: "Full" },
            { username: "Dian", pass: "dian123", role: "Full" },
            { username: "Operator", pass: "Operator123", role: "Operator" },
            { username: "Viewer", pass: "", role: "Viewer" }
        ];

        let currentUser = null;
        let loginModalInstance = null;

        document.addEventListener("DOMContentLoaded", () => {
            loginModalInstance = new bootstrap.Modal(document.getElementById('loginModal'));
            checkActiveSession();
        });

        function checkActiveSession() {
            const savedUser = localStorage.getItem('extruder_logged_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                applyUserPermissions();
            } else {
                loginModalInstance.show();
            }
        }

        function executeLogin(event) {
            event.preventDefault();
            const uInput = document.getElementById('loginUsername').value.trim();
            const pInput = document.getElementById('loginPassword').value.trim();
            const alertBox = document.getElementById('loginAlertBox');

            const matched = USER_ACCOUNTS.find(acc => acc.username.toLowerCase() === uInput.toLowerCase());
            if (!matched) {
                alertBox.innerText = "Username tidak ditemukan!";
                alertBox.classList.remove('d-none');
                return;
            }

            if (matched.pass !== "" && matched.pass !== pInput) {
                alertBox.innerText = "Password salah!";
                alertBox.classList.remove('d-none');
                return;
            }

            currentUser = matched;
            localStorage.setItem('extruder_logged_user', JSON.stringify(currentUser));
            loginModalInstance.hide();
            applyUserPermissions();
        }

        function handleLogout() {
            localStorage.removeItem('extruder_logged_user');
            location.reload();
        }

        function applyUserPermissions() {
            const badge = document.getElementById('navSessionBadge');
            badge.className = "badge bg-success px-3 py-2 fw-bold";
            badge.innerHTML = `🟢 SESI AKTIF: ${currentUser.username}`;
        }
    </script>
</body>
</html>
